# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: http
  buildCommand: npm install && npm run build
  startCommand: MODE=http node build/index.js
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      enableCors:
        type: boolean
        default: false
        description: Enable CORS
      corsOrigin:
        type: string
        default: "*"
        description: CORS origin
      defaultSearchEngine:
        type: string
        default: duckduckgo
        description: Default search engine (bing, baidu, csdn, duckduckgo, exa, brave, juejin, startpage, sogou)
      useProxy:
        type: boolean
        default: false
        description: Enable HTTP proxy (only meaningful in self-hosted environments; the Smithery cloud can reach overseas engines directly)
      proxyUrl:
        type: string
        default: http://127.0.0.1:7890
        description: Proxy server URL (only meaningful when useProxy is true)
      exaApiKey:
        type: string
        default: ""
        description: Optional Exa API key (https://dashboard.exa.ai/api-keys) — only needed for the exa engine
  exampleConfig:
    enableCors: false
    corsOrigin: "*"
    defaultSearchEngine: duckduckgo
