name: CI

# 只跑确定性检查（编译 + 单元测试），不跑 live 网络测试：
# live 测试依赖海外引擎可达性/上游反爬状态，必须在本地手动执行（npm run test:live）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # optionalDependencies（wreq-js 原生 binding / playwright-core 等）在 CI 上可能装不上，
      # 这正是设计上的降级路径：缺失时相关引擎回退 axios，单测不应依赖它们
      - run: npm ci

      - run: npm run typecheck:strict

      # any 增量卡点（ratchet）：新文件禁止引入 any，历史文件的 any 总量受 --max-warnings 封顶
      - run: npm run lint

      - run: npm run build

      - run: npm run test:vitest

      # 自校验脚本（src/test/test-*.ts）覆盖了 vitest 没有触碰的工具模块
      # （utils/text、utils/queryPreprocess、utils/dnsCache、core/validation/targetValidation 等）。
      # 这里只跑白名单里的确定性脚本；live 网络测试仍然只在本地手动跑 `npm run test:live`。
      - run: npm run test:deterministic
